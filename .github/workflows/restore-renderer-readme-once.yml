name: Restore renderer README once

on:
  push:
    branches:
      - docs/restore-renderer-readme

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v5
        with:
          ref: docs/restore-renderer-readme
          fetch-depth: 0

      - name: Restore current README and remove only the duplicate badge
        run: |
          set -euo pipefail
          git show 80940a68969fb78d3c18b3e42ed5e3a44d26b3d7:README.md > README.md
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'README.md';
          const duplicate = '[![license](https://img.shields.io/github/license/Plasius-LTD/gpu-renderer)](./LICENSE)';
          const canonical = '[![License](https://img.shields.io/github/license/Plasius-LTD/gpu-renderer)](./LICENSE)';
          const lines = fs.readFileSync(path, 'utf8').replace(/\r\n/g, '\n').split('\n');
          const index = lines.indexOf(duplicate);
          if (index < 0) {
            throw new Error('Expected duplicate licence badge was not found');
          }
          lines.splice(index, 1);
          if (lines[index] === '') {
            lines.splice(index, 1);
          }
          const output = lines.join('\n');
          if (!output.includes(canonical) || output.includes(duplicate)) {
            throw new Error('README badge restoration validation failed');
          }
          fs.writeFileSync(path, output.endsWith('\n') ? output : `${output}\n`);
          NODE

      - name: Commit corrected README only
        run: |
          set -euo pipefail
          rm .github/workflows/restore-renderer-readme-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/restore-renderer-readme-once.yml
          git diff --cached --check
          git commit -m "docs: restore current renderer README"
          git push origin HEAD:docs/restore-renderer-readme
